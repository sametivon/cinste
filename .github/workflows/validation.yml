name: Validation

on:
  pull_request:
  push:
    branches:
      - main

# Owner review is required before merge because this enables external CI.
permissions:
  contents: read

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check changed paths and immutable migration history
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run safety:gate -- audit --base "$BASE_REF"
      - run: npm run test:change-safety
      - run: npm run test:scheduler
      - run: npm run test:provisioning
      - run: npm run test:funding
      - run: npm run test:native-giver-bff

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm --prefix apps/mobile run typecheck
      - run: npm --prefix apps/mobile test
