name: Validation

on:
  pull_request:
  push:
    branches:
      - main

# Owner review is required before merge because this enables external CI.
permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - run: npm --prefix apps/mobile run typecheck
      - run: npm --prefix apps/mobile test
